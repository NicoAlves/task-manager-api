services:
  php:
      build:
        context: ./docker/php
      container_name: symfony_php
      working_dir: /var/www/html
      volumes:
        - .:/var/www/html
      depends_on:
        - db

  nginx:
    image: nginx:latest
    container_name: symfony_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: ticket_manager_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticket_manager
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
